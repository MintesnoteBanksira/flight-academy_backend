services:
  - type: web
    name: flight-academy-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && pip install aiofiles greenlet
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./flight_academy.db
      - key: DEBUG
        value: "false"
      - key: UPLOAD_DIR
        value: uploads
